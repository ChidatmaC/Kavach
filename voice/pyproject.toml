[project]
name = "kavach-voice"
version = "0.1.0"
description = "Kavach AI scam hotline (Pipecat)"
requires-python = ">=3.11"
dependencies = [
  "pipecat-ai[deepgram,cartesia,silero,websocket]",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.33",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = false
